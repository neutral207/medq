

#backend-yaml


services: 
- type: web
  name: medq-backend
  runtime: python
  buildCommand: pip install -r requirements.txt
  startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT main:app
  envVars:
    - key: DATABASE_URL
    sync: false
    - key: JWT_SECRET
    sync: false
    - key: FLASK_ENV
      value: production
    - key: PYTHON_VERSION
      value: 3.11.0

