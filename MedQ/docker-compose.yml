services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medq
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  api:
    image: python:3.12
    working_dir: /app
    environment:
      FLASK_APP: src.config.main:create_app
      FLASK_DEBUG: "1"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/medq
    volumes:
      - ./backend:/app
    command: bash -lc "pip install -r requirements.txt && python -m src.config.main"
    ports: ["5000:5000"]
    depends_on: [db]
  web:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
