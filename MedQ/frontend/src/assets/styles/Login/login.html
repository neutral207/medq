<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <script src="login.js" defer></script>
</head>
<body>
    <h2>Login</h2>
    <form id="loginForm">
        <input type="text" id="identifier" placeholder="Username or Employee Number" required><br>
        <input type="password" id="password" placeholder="Password" required><br>
        <button type="submit">Login</button>
    </form>
    <p id="message"></p>
</body>
</html>
